# Tessera site configuration. Everything here is optional: anything you leave out keeps its default
# (the defaults are listed in docs/DESIGN.md). After editing, `python -m tessera serve` reloads by itself.

site:
  name: "Tessera"                       # shown in the header, the browser tab and search results
  author: "Your Name"                   # used for the footer, the feed and search engines (JSON-LD)
  tagline: "Notes on things I am learning"
  description: "A technical blog with real equations, interactive figures and a map of how every idea connects."
                                        # ≤155 characters: what search engines show for the home page
  origin: "https://example.com"         # where the site will live, without a trailing slash (canonical links, sitemap)
  language: en
  avatar: ""                            # optional: e.g. static/avatar.png (also the share image and favicon)
  links:                                # leave a value empty to hide it from the footer
    github: ""                          # e.g. https://github.com/you
    x: ""
    linkedin: ""
    email: ""                           # e.g. you@example.com
    scholar: ""

# The header menu, in order. href is a path on this site or a full URL.
nav:
  - {label: Writing, href: /posts/}
  - {label: Projects, href: /projects/}
  - {label: Map, href: /explore/}
  - {label: Ask, href: /ask/}

# Each kind is a folder content/<kind>/ and a list page /<kind>/. A page's id is "<singular, lowercase>:<file name>",
# for example post:welcome for content/posts/welcome.md.
kinds:
  posts:    {label: Writing,  singular: Post}
  projects: {label: Projects, singular: Project}

home:
  intro: |
    This is **Tessera**, a template for technical writing. Posts are Markdown with real equations, citations and
    interactive figures, and every page is a tile in a map of how the ideas connect. Start with
    [the welcome post](/posts/welcome/), then replace this paragraph in `site.yml`.
  show: [latest, series, map]           # the home page sections, in order

theme:
  accent: "#3b5bdb"                     # one colour; every other colour is derived from it, in light and dark mode
  font_text: "Source Serif 4"           # any Google Fonts family names
  font_ui: "Inter"
  font_code: "JetBrains Mono"
  font_math: "STIX Two Math"            # needs a font with a MATH table; STIX Two Math is the safe choice
  width: 720                            # the reading column, in pixels
  mode: auto                            # auto (follows the reader's system) | light | dark

features: {ask: true, explore: true, series: true, feed: true, llms_txt: true}

# Optional. Without a model everything works except LLM proposals and written answers on the Ask page.
llm:
  base_url: "https://openrouter.ai/api/v1"   # any OpenAI-compatible API; a local Ollama is http://localhost:11434/v1
  model: ""                             # e.g. "openai/gpt-4o-mini" or "llama3.1"; comma-separated = fallbacks
  key_env: "LLM_API_KEY"                # the environment variable that holds the key (.env.local is read too)

ask:
  written_answers: true                 # needs llm.model and the key on the server
  per_visitor: 5                        # written answers per visitor (IP) per day
  daily_cap: 300                        # written answers per day for the whole site

# What Publish (Studio or `python -m tessera publish`) does after building, on your machine.
publish:
  commit: true                          # git add the page and its files, then commit
  push: true                            # git push (Vercel, Netlify or GitHub Pages deploy from the repository)
  command: ""                           # optional extra step, e.g. "vercel deploy --prod --yes"
  author: ""                            # optional "Name <email>" for commits (default: your git config)
