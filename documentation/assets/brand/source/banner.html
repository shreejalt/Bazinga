<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,700;1,400&family=Courier+Prime:wght@400;700&display=block" rel="stylesheet">
<style>
:root{--bg:#FBF7EC;--ink:#1D1A15;--ink2:#8A8174;--dot:#1D1A15;--grid:#E7DFCD;--blue:#0F52BA;--skin:#FBF7EC;--y:#F2B632}
body.dark{--bg:#16130F;--ink:#FBF7EC;--ink2:#9C9385;--dot:#FBF7EC;--grid:#2A251E;--blue:#6E9CF0;--skin:#FBF7EC}
html,body{margin:0;width:1280px;height:440px;overflow:hidden;background:var(--bg)}
svg text{font-family:"Courier Prime",monospace}
.name{font-family:"STIX Two Text",serif;font-weight:700;font-size:104px}
.tag{font-family:"STIX Two Text",serif;font-style:italic;font-size:30px}
</style></head><body>
<svg id="s" width="1280" height="440" viewBox="0 0 1280 440"></svg>
<script>
const T=5.0, s=document.getElementById('s');
const css=n=>getComputedStyle(document.body).getPropertyValue(n).trim();
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x)), seg=(t,a,b)=>clamp((t-a)/(b-a),0,1), ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
// the hand as a connect-the-dots outline (hand box origin at OX,OY)
const OX=150, OY=40;
const P=[[100,372],[90,252],[50,214],[26,186],[24,166],[40,152],[60,160],[94,190],[70,80],[72,58],[86,44],[102,52],[112,30],[126,20],[142,30],[152,168],[166,40],[180,24],[198,24],[208,40],[222,52],[238,60],[244,80],[234,246],[214,372]].map(([x,y])=>[x+OX,y+OY]);
const L=[]; let tot=0; for(let i=0;i<P.length-1;i++){const d=Math.hypot(P[i+1][0]-P[i][0],P[i+1][1]-P[i][1]); L.push(d); tot+=d;}
function along(f){ // point and segment index at fraction f of the outline
  let d=f*tot; for(let i=0;i<L.length;i++){ if(d<=L[i]) {const u=d/L[i]; return [P[i][0]+(P[i+1][0]-P[i][0])*u, P[i][1]+(P[i+1][1]-P[i][1])*u, i];} d-=L[i]; }
  return [...P[P.length-1], L.length-1]; }
function pencil(x,y,rot,sc=1){ // tip at (x,y)
  const ink=css('--ink');
  return `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${sc})">
   <path d="M0 0 L-9 -26 L9 -26 Z" fill="#F3D9A8" stroke="#1D1A15" stroke-width="4" stroke-linejoin="round"/>
   <path d="M0 0 L-3.5 -10 L3.5 -10 Z" fill="#1D1A15"/>
   <rect x="-11" y="-150" width="22" height="124" fill="#F2B632" stroke="#1D1A15" stroke-width="4"/>
   <rect x="-7" y="-146" width="5" height="116" fill="#F8D477"/>
   <rect x="-11" y="-162" width="22" height="12" fill="#C9CCD3" stroke="#1D1A15" stroke-width="4"/>
   <rect x="-11" y="-178" width="22" height="16" rx="6" fill="#E2707A" stroke="#1D1A15" stroke-width="4"/></g>`; }
function render(t){
  const ink=css('--ink'), ink2=css('--ink2'), blue=css('--blue'), grid=css('--grid'), dot=css('--dot');
  const out=1-seg(t,4.6,4.95);
  let h='';
  // dotted paper
  for(let x=20;x<1280;x+=28) for(let y=16;y<440;y+=28) h+=`<circle cx="${x}" cy="${y}" r="1.4" fill="${grid}"/>`;
  h+=`<g opacity="${out}">`; const fadeDraw=1-ease(seg(t,2.45,2.75)); h+=`<g opacity="${fadeDraw}">`;
  // dots and numbers pop in
  const pop=seg(t,0.0,0.35);
  P.forEach(([x,y],i)=>{ const on=pop*P.length>i; if(!on) return;
    h+=`<circle cx="${x}" cy="${y}" r="5" fill="${dot}"/>`;
    const cx0=OX+150, cy0=OY+230, dx=x-cx0, dy=y-cy0, n=Math.hypot(dx,dy)||1, lx=x+dx/n*17, ly=y+dy/n*17+4;
    h+=`<text x="${lx}" y="${ly}" font-size="11" fill="${ink2}" text-anchor="middle" opacity="${1-seg(t,2.1,2.35)}">${i+1}</text>`; });
  // the line drawn so far
  const f=ease(seg(t,0.4,2.0)); const [px,py,k]=along(f);
  let d=`M${P[0][0]} ${P[0][1]}`; for(let i=1;i<=k;i++) d+=` L${P[i][0]} ${P[i][1]}`; d+=` L${px} ${py}`;
  const fill=seg(t,2.05,2.4);
  if(fill>0){ let dd=`M${P[0][0]} ${P[0][1]}`; for(let i=1;i<P.length;i++) dd+=` L${P[i][0]} ${P[i][1]}`;
    h+=`<path d="${dd} Z" fill="${blue}" opacity="${0.16*fill}"/>`; }
  h+=`<path d="${d}" fill="none" stroke="${ink}" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>`;
  // the pencil: rides the tip while drawing, then stands up beside the hand
  const stand=ease(seg(t,2.05,2.5));
  if(t<2.05){ h+=pencil(px,py,-28); }
  else { const sx=px+(OX+300-px)*stand, sy=py+(OY+372-py)*stand, r=-28*(1-stand); h+=pencil(sx,sy,r,1+0.25*stand); }
  h+='</g>';
  // the drawing becomes the logo
  const lg=ease(seg(t,2.6,3.0));
  if(lg>0){ const sc=0.9+0.1*lg; h+=`<g opacity="${lg}" transform="translate(${OX+150} ${OY+190}) scale(${sc}) translate(-170 -170)"><image href="mark.svg" width="340" height="340"/></g>`; }
  // the wordmark and tagline
  const w=ease(seg(t,2.8,3.25)), g=ease(seg(t,3.1,3.55));
  h+=`<g opacity="${w}" transform="translate(${560+20*(1-w)} 0)">
      <text class="name" x="0" y="232" fill="${ink}" style="font-family:'STIX Two Text',serif;font-weight:700;font-size:112px">Bazin<tspan fill="${blue}">ga</tspan><tspan fill="#F2B632" stroke="#1D1A15" stroke-width="3" paint-order="stroke">!</tspan></text></g>`;
  h+=`<text x="${562}" y="300" fill="${blue}" opacity="${g}" style="font-family:'STIX Two Text',serif;font-style:italic;font-size:34px">Live long and connect the dots.</text>`;
  h+=`</g>`;
  s.innerHTML=h;
}
window.render=render; window.T=T; render(3.0);
</script></body></html>
