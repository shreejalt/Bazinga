# The CV page (/cv/). Replace every example below with your own record; the page lays it out the same way.
# Optional per role: `tags` (topic slugs from content/topics.yml: they link to the topic pages), `pages` (ids of pages
# on this site about that work, e.g. project:bazinga), `used` (the tools and methods the role's lines name), and
# `link` ({label, url}: one more page or address for the role). The build refuses unknown tags and page ids.

contact:
  email: you@example.com
  links:
    - {label: github.com/your-handle, url: "https://github.com/your-handle"}
    - {label: linkedin.com/in/your-handle, url: "https://www.linkedin.com/in/your-handle/"}

