# The documentation site (MkDocs Material), published on GitHub Pages for the Bazinga repository only.
# Your own copy of the template publishes your site with pages.yml instead, so this workflow does nothing there.
# One-time setting in the repository: Settings -> Pages -> Source: "GitHub Actions".
name: Documentation
on:
  push:
    branches: [main]
    paths:
      - mkdocs.yml
      - documentation/**
      - .github/workflows/docs.yml
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: docs-pages
  cancel-in-progress: true
jobs:
  build:
    if: github.repository == 'shreejalt/Bazinga'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: documentation/requirements.txt
      - run: python -m pip install -r documentation/requirements.txt
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _docs_site
  deploy:
    if: github.repository == 'shreejalt/Bazinga'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
