# GitHub Pages: build and deploy on every push to main, and once a day so scheduled posts go live on their date.
# Turn it on in the repository: Settings -> Pages -> Source: "GitHub Actions". Until you do (for example because you
# deploy with Vercel or Netlify), every run stops at the first step with a note and nothing fails.
# In the Bazinga repository itself these jobs are skipped: its Pages site is the documentation (docs.yml).
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  check:
    if: github.repository != 'shreejalt/Bazinga'
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null | grep -q workflow; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not set to GitHub Actions in this repository (Settings -> Pages), so this run deploys nothing."
          fi
  build:
    needs: check
    if: needs.check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover tests
      # The address GitHub serves the site at: https://<user>.github.io/<repo> for a project site (every link then
      # starts with /<repo>), or the custom domain when one is set. It replaces site.origin for this build only.
      - id: pages
        uses: actions/configure-pages@v5
      - run: python -m bazinga build
        env:
          BAZINGA_ORIGIN: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
