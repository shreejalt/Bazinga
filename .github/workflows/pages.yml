# GitHub Pages: build and deploy on every push to main, and once a day so scheduled posts go live on their date.
# Turn it on in the repository: Settings -> Pages -> Source: "GitHub Actions".
# In the Bazinga repository itself these jobs are skipped: its Pages site is the documentation (docs.yml).
# In your own copy (a fork or "Use this template") they run and publish your site.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    if: github.repository != 'shreejalt/Bazinga'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover tests
      # The address GitHub serves the site at: https://<user>.github.io/<repo> for a project site (every link then
      # starts with /<repo>), or the custom domain when one is set. It replaces site.origin for this build only.
      - id: pages
        uses: actions/configure-pages@v5
      - run: python -m bazinga build
        env:
          BAZINGA_ORIGIN: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    if: github.repository != 'shreejalt/Bazinga'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
