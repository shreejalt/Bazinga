# LaTeX people write in ML and maths blogs, and what Tessera must do with each.
#
#   tex:     the formula as written (YAML single quotes: backslashes are literal, '' is a quote)
#   display: true for $$ … $$ (default false: inline $ … $)
#   expect:  ok (renders as valid MathML Core) or error (a MathError with a hint)
#   has:     strings the MathML (without its LaTeX annotation) must contain
#   lacks:   strings it must not contain
#   error:   words the error message must contain;  hint: words the hint must contain
#   at:      [line, column] of the error inside the formula (0-based)
#
# tests/test_core_math_corpus.py runs every item; scratchpad pages render them all in Chrome and WebKit.

